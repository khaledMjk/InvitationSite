<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #0a0806;
    font-family: 'Cormorant Garamond', serif;
  }

  .card {
    position: relative;
    width: 1080px;
    height: 1920px;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(201,164,78,0.10) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 80%, rgba(201,164,78,0.08) 0%, transparent 50%),
      linear-gradient(180deg, #0f0d0a 0%, #1a1611 30%, #12100c 60%, #0f0d0a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #e8dcc8;
  }

  /* ── Outer ornamental border ── */
  .border-outer {
    position: absolute;
    inset: 24px;
    border: 1px solid rgba(201,164,78,0.25);
    pointer-events: none;
  }
  .border-inner {
    position: absolute;
    inset: 36px;
    border: 1px solid rgba(201,164,78,0.15);
    pointer-events: none;
  }

  /* ── Corner ornaments ── */
  .corner {
    position: absolute;
    width: 90px;
    height: 90px;
    pointer-events: none;
  }
  .corner svg { width:100%; height:100%; }
  .corner--tl { top:28px; left:28px; }
  .corner--tr { top:28px; right:28px; transform: scaleX(-1); }
  .corner--bl { bottom:28px; left:28px; transform: scaleY(-1); }
  .corner--br { bottom:28px; right:28px; transform: scale(-1,-1); }

  /* ── Moroccan geometric pattern band ── */
  .pattern-band {
    position: absolute;
    width: 100%;
    height: 60px;
    opacity: 0.12;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .pattern-band--top { top: 60px; }
  .pattern-band--bottom { bottom: 60px; }
  .pattern-band svg { height: 60px; width: auto; }

  /* ── Sparkle dots ── */
  .sparkle {
    position: absolute;
    width: 4px; height: 4px;
    background: #c9a44e;
    border-radius: 50%;
    opacity: 0.3;
  }
  .sparkle:nth-child(1) { top:15%; left:12%; opacity:0.2; width:3px; height:3px; }
  .sparkle:nth-child(2) { top:25%; right:15%; opacity:0.35; }
  .sparkle:nth-child(3) { top:45%; left:8%; opacity:0.15; width:2px; height:2px; }
  .sparkle:nth-child(4) { top:60%; right:10%; opacity:0.25; }
  .sparkle:nth-child(5) { top:75%; left:18%; opacity:0.2; width:3px; height:3px; }
  .sparkle:nth-child(6) { top:85%; right:20%; opacity:0.15; }
  .sparkle:nth-child(7) { top:10%; left:45%; opacity:0.18; width:2px; height:2px; }
  .sparkle:nth-child(8) { top:35%; right:30%; opacity:0.12; width:3px; height:3px; }

  /* ── Content ── */
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 80px;
    gap: 0;
  }

  /* Bismillah */
  .bismillah {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: rgba(201,164,78,0.6);
    letter-spacing: 3px;
    margin-bottom: 30px;
    font-style: italic;
  }

  /* Top ornament star */
  .top-orn {
    color: #c9a44e;
    font-size: 18px;
    letter-spacing: 16px;
    margin-bottom: 30px;
    opacity: 0.7;
  }

  /* Monogram / Logo area */
  .monogram {
    width: 200px;
    height: 200px;
    border: 2px solid rgba(201,164,78,0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 35px;
    position: relative;
    background: radial-gradient(circle, rgba(201,164,78,0.05) 0%, transparent 70%);
  }
  .monogram::before {
    content: '';
    position: absolute;
    inset: -8px;
    border: 1px solid rgba(201,164,78,0.15);
    border-radius: 50%;
  }
  .monogram-text {
    font-family: 'Great Vibes', cursive;
    font-size: 80px;
    color: #c9a44e;
    line-height: 1;
  }

  /* Families */
  .families {
    margin-bottom: 10px;
  }
  .families-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    color: rgba(201,164,78,0.5);
    text-transform: uppercase;
    letter-spacing: 6px;
    margin-bottom: 10px;
  }
  .families-names {
    font-family: 'Cinzel', serif;
    font-size: 26px;
    color: #c9a44e;
    letter-spacing: 6px;
    font-weight: 500;
  }
  .families-amp {
    display: inline-block;
    margin: 8px 0;
    font-family: 'Great Vibes', cursive;
    font-size: 32px;
    color: rgba(201,164,78,0.6);
    letter-spacing: 0;
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 28px 0;
  }
  .divider-line {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,164,78,0.5), transparent);
  }
  .divider-diamond {
    color: #c9a44e;
    font-size: 10px;
    opacity: 0.7;
  }

  /* Invite text */
  .invite-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 26px;
    color: #bfad8f;
    line-height: 1.6;
    margin-bottom: 8px;
  }

  /* Couple names */
  .couple {
    font-family: 'Great Vibes', cursive;
    font-size: 96px;
    color: #c9a44e;
    line-height: 1.2;
    margin: 10px 0;
    text-shadow: 0 0 40px rgba(201,164,78,0.15);
  }
  .couple .amp {
    font-size: 68px;
    display: inline-block;
    margin: 0 12px;
    opacity: 0.7;
    vertical-align: middle;
  }

  /* Date & Venue */
  .date {
    font-family: 'Cinzel', serif;
    font-size: 30px;
    color: #e8dcc8;
    letter-spacing: 5px;
    font-weight: 500;
    margin-top: 6px;
  }

  .time {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    color: rgba(201,164,78,0.7);
    letter-spacing: 4px;
    margin-top: 10px;
  }

  .venue {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    color: #c9a44e;
    letter-spacing: 8px;
    font-weight: 600;
    margin-top: 24px;
  }
  .venue-sub {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    color: rgba(191,173,143,0.6);
    letter-spacing: 3px;
    margin-top: 6px;
    font-style: italic;
  }

  /* Link section */
  .link-section {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .link-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    color: rgba(191,173,143,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .link-box {
    border: 1px solid rgba(201,164,78,0.3);
    padding: 14px 40px;
    border-radius: 4px;
    background: rgba(201,164,78,0.04);
  }
  .link-url {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    color: #c9a44e;
    letter-spacing: 2px;
    text-decoration: none;
  }

  /* Bottom ornament */
  .bottom-orn {
    margin-top: 40px;
    color: #c9a44e;
    font-size: 28px;
    opacity: 0.4;
  }

  /* Arabesque SVG motifs on sides */
  .side-motif {
    position: absolute;
    opacity: 0.08;
    pointer-events: none;
  }
  .side-motif--left {
    left: 44px;
    top: 50%;
    transform: translateY(-50%);
  }
  .side-motif--right {
    right: 44px;
    top: 50%;
    transform: translateY(-50%) scaleX(-1);
  }
</style>
</head>
